name: duck race

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  roll:
    if: startsWith(github.event.issue.title, 'dice|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Rolls can land at the same time. If someone else's roll was pushed first,
      # start over from the newest state and roll again, so no roll is lost.
      - name: Roll and save
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMENT_PATH: ${{ runner.temp }}/comment.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            python3 game/dice.py
            git add -A README.md game
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit --quiet -m "🎲 @${ISSUE_USER} rolled the dice"
            if git push --quiet origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "🌊 the pond got really busy and your roll didn't land. give it another go!" > "$COMMENT_PATH"
          exit 1

      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_PATH: ${{ runner.temp }}/comment.md
        run: |
          if [ ! -s "$COMMENT_PATH" ]; then
            echo "😵 something broke on our side and your roll didn't count. try again in a bit!" > "$COMMENT_PATH"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$COMMENT_PATH"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
